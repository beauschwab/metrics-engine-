# The Python side of the repo: the compute backends the conformance harness
# executes, and the warehouse transport.
#
# uv-managed (ADR-51). `uv sync` builds `.venv` from `uv.lock`, which pins the
# full resolved graph rather than just the seven names below — the transitive
# set is what actually broke here before, so a lockfile is the point.
#
#   uv sync                    # or: npm run setup:python
#
# The suites reach these through a bare `python3` — `execFileSync('python3', …)`
# in the conformance and Flight SQL tests — so `.venv/bin` has to be on PATH for
# them to run rather than skip. `uv run` does that for you; CI puts it on PATH
# once for the whole job.
#
# Nothing here is needed to run the authoring surface, which evaluates rules in
# the browser.
[project]
name = "keel-python"
version = "0.1.0"
description = "Compute backends and warehouse transport for the conformance harness."
requires-python = ">=3.11"

dependencies = [
  # --- conformance: the reference engine and the two compute targets --------
  "duckdb==1.5.5",
  # 1.43.2, not the 1.43.1 this repo carried: 1.43.1 resolves to
  # `polars-runtime-32==1.43.1`, which is yanked. pip installs a yanked
  # release with a warning on stderr and carries on, so the pin looked fine
  # for as long as pip was the only thing reading it; uv refuses, which is how
  # it was found at all. .2 is the replacement patch.
  "polars==1.43.2",
  "pyarrow==25.0.0",

  # --- Iceberg: catalogue, snapshot reads, partition-scoped writes ----------
  "pyiceberg==0.11.1",
  # PyIceberg's SqlCatalog is a SQLAlchemy application. Held at 2.x
  # deliberately: anything that drags in `flightsql-dbapi` will try to pull
  # this back to 1.4, and it did once — the Iceberg conformance leg started
  # failing for a reason that had nothing to do with Iceberg.
  "sqlalchemy==2.0.51",

  # --- Dremio: Arrow Flight SQL over gRPC ----------------------------------
  # ADBC rather than `flightsql-dbapi` — same protocol, no sqlalchemy pin, and
  # the Arrow batches arrive without a DB-API layer in between.
  "adbc-driver-flightsql==1.12.0",
  "adbc-driver-manager==1.12.0",
]

# Nothing here is importable as a package; this project exists to describe an
# environment, not to ship one.
[tool.uv]
package = false
