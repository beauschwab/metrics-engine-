# The daily liquidity pipeline: orchestration, contracts, conformance, and the
# runtime half of the rules-engine loop.
#
# A separate uv project from the repo root on purpose. The root environment
# (ADR-51) is the conformance harness's — seven pinned names and the lock that
# actually matters. Airflow and dbt each drag in a dependency graph an order of
# magnitude larger, and pinning those into the root lock would make every
# conformance run hostage to an Airflow resolution. Same philosophy, second
# lock: `uv sync` in this directory builds `.venv` from `uv.lock`, and the
# transitive graph is the artifact.
#
#   uv sync                # dev: Airflow + dbt-duckdb + DuckDB
#   uv sync --extra prod   # adds PySpark, dbt-spark and PyIceberg
#
# The `prod` extra is not installed in CI or the local e2e run — DuckDB is the
# dev engine end to end (the point of this reference implementation), and the
# Spark/Iceberg backend is exercised where a JVM and an Iceberg catalog exist.
[project]
name = "liquidity-pipeline"
version = "0.1.0"
description = "Reference Airflow pipeline: ODCS-sourced daily liquidity positions, dbt conformance, registry-driven FR 2052a rules and LCR."
requires-python = ">=3.11,<3.13"

dependencies = [
  # --- orchestration -------------------------------------------------------
  # Airflow 3: `airflow dags test` executes a full DAG run in-process, which
  # is what the e2e proof uses. The standard provider carries PythonOperator
  # and friends.
  "apache-airflow>=3.0,<3.2",

  # --- conformance and normalization ---------------------------------------
  # dbt-core arrives via the adapter. dbt-duckdb is the dev target; the prod
  # target (dbt-spark) is in the `prod` extra.
  "dbt-duckdb>=1.9.0",

  # --- the dev engine ------------------------------------------------------
  "duckdb>=1.1",

  # --- contracts and the registry client -----------------------------------
  "pyyaml>=6.0",
]

[project.optional-dependencies]
prod = [
  # The product target: PySpark writing Iceberg through a REST or Glue
  # catalog. dbt-spark conforms in the same engine; PyIceberg gives the
  # report writer partition-scoped overwrites without a Spark round trip.
  "pyspark>=3.5,<4",
  "dbt-spark[session]>=1.9.0",
  "pyiceberg>=0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

# An environment description plus one importable package (`liquidity_pipeline`).
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["liquidity_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_registry: needs a running keel registry (KEEL_BASE_URL)",
  "spark: needs the prod extra and a JVM",
]
