version: 2

models:
  - name: fct_2052a_positions
    description: >
      Canonical daily positions in FR 2052a scope, unioned across source
      systems. The vocabulary tests below restate the classification rules'
      reading assumptions: a value outside these domains would silently match
      no rule (or the wrong one), so it is stopped here.
    columns:
      - name: position_id
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: entity_id
        tests:
          - not_null
          - accepted_values:
              values: [BANK_US, BANK_UK, BANK_SG, BANK_DE]
      - name: segment
        tests:
          - not_null
          - accepted_values:
              values: [RETAIL, SMALL_BUSINESS, WHOLESALE]
      - name: counterparty_type
        tests:
          - not_null
          - accepted_values:
              values: [RETAIL, SMB, NONFIN_CORP, FINANCIAL, SOVEREIGN]
      - name: account_type
        tests:
          - not_null
          - accepted_values:
              values: [TRANSACTIONAL, SAVINGS, TIME, OPERATIONAL, NON_OPERATIONAL]
      - name: direction
        tests:
          - not_null
          - accepted_values:
              values: [INFLOW, OUTFLOW]
      - name: collateral_class
        tests:
          - not_null
          - accepted_values:
              values: [L1, L2A, L2B, NON_HQLA, UNSECURED]
      - name: balance_usd
        tests: [not_null]

  - name: fct_liquidity_position
    description: Conformed daily HQLA inventory; numerator inputs for the LCR.
    columns:
      - name: security_id
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: entity_id
        tests:
          - not_null
          - accepted_values:
              values: [BANK_US, BANK_UK, BANK_SG, BANK_DE]
      - name: hqla_level
        tests:
          - not_null
          - accepted_values:
              values: [L1, L2A, L2B]
      - name: hqla_eligible_amount
        tests: [not_null]
