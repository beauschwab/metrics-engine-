<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600" />
    <title>Chartroom</title>
    <!-- Inter is self-hosted (see styles.css). Aperture leans on Inter's
         tabular figures for every numeric column here, and a webfont that
         arrives over the network is one that sometimes does not: behind a
         proxy or offline the import fails silently and every number reflows
         into whatever proportional stack the OS supplies. -->
    <link rel="preload" as="font" type="font/woff2"
      href="/fonts/inter-latin.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
