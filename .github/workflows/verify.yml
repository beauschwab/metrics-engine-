# Everything `npm run verify` runs, on every push and pull request.
#
# `verify` is `turbo run typecheck test e2e verify`, and every one of those legs
# has a job below. That claim used to be false: the workflow ran three hand-written
# scripts while `verify` ran four, so seven workspaces, 220 unit tests, seven studio
# browser specs and the Python agent's whole gate were checked by nothing on the way
# in (ADR-49).
#
# Turborepo is what keeps it true now (ADR-50). A job says `turbo run <task>` and
# gets every workspace that defines that task — including ones added later. The
# fan-out is derived from the package graph rather than from a list here that
# somebody has to remember to extend.
#
# Still split into jobs rather than one script, so a failure names itself in the
# checks list: "typecheck" and "browser" failing are different problems with
# different owners. Within a job, turbo prefixes every line with the package it
# came from, so the specific workspace is named too.

name: verify

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suites are noisy about a TTY they do not have.
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'
  # uv's default is 30s per download, which the Python side overruns on a slow
  # link — polars-runtime and pyarrow alone are ~100MB. A timeout here reads as
  # a dependency that cannot be resolved rather than as a slow network.
  UV_HTTP_TIMEOUT: '180'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ github.sha }}
          restore-keys: turbo-typecheck-
      - run: npx turbo run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      # From uv.lock, exactly — `--frozen` fails rather than re-resolving, so a
      # lockfile nobody regenerated is an error here instead of a drift nobody
      # sees. The pins matter: `flightsql-dbapi` pins `sqlalchemy<2` and
      # installing it once silently broke PyIceberg's catalogue, presenting as
      # an Iceberg conformance bug with nothing to do with Iceberg.
      - run: uv sync --frozen
      # The conformance and Flight SQL suites shell out to a bare `python3`, so
      # the synced environment has to *be* that python3 for them to run rather
      # than skip themselves into a green tick that means nothing.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ github.sha }}
          restore-keys: turbo-test-
      # The conformance legs skip themselves when their interpreter is missing.
      # That is right locally and wrong here, so the install above is a hard
      # dependency of this job and a green run genuinely means they executed.
      - run: npx turbo run test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's own browser, matching the pinned @playwright/test. The
      # `CHROMIUM_PATH` escape hatch in the config exists for images that ship a
      # different build; a hosted runner has no such constraint.
      - run: npx playwright install --with-deps chromium
      - run: npx turbo run e2e --filter=registry-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/registry-web/playwright-report/
            apps/registry-web/test-results/
          retention-days: 7

  chartroom-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The studio's own config starts a chartroom-api against a scratch SQLite
      # file and a blanked API key, so this exercises the degrade path.
      - run: npx turbo run e2e --filter=chartroom-studio
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chartroom-playwright-report
          path: |
            apps/chartroom-studio/playwright-report/
            apps/chartroom-studio/test-results/
          retention-days: 7

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Node, not just Python. `test_governed_live` drives the real
      # `chartroom-mcp` server over stdio and `test_warehouse_parity` boots a
      # real `chartroom-api` — both are TypeScript run through tsx, so without
      # `node_modules` they die on `@modelcontextprotocol/sdk` and the parity
      # suite reports a port that never opened.
      - run: npm ci
      # No setup step: the gate is `uv run`, which builds the environment from
      # `apps/chartroom-agent/uv.lock` on demand. The venv used to be a manual
      # prerequisite, which is why this gate had never run anywhere but on a
      # machine somebody had configured by hand.
      - run: npx turbo run verify
