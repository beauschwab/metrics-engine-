# Everything `npm run verify` runs, on every push and pull request.
#
# That claim was false until ADR-49. `verify` is
# `typecheck && test && e2e && verify:chartroom`, and this file ran the first
# three — so seven workspaces, 220 unit tests, seven studio browser specs and
# the Python agent's whole ruff/mypy/pytest gate were checked by nothing on the
# way in. The four jobs below cover the fourth part. If a leg is added to
# `verify`, it gets a job here in the same commit, or the header lies again.
#
# The suites in this repo are only worth having if they run without being asked.
# Three of them need something beyond Node — a Python interpreter with Polars and
# PyIceberg, a Chromium — so the job installs those rather than letting the
# affected tests skip themselves into a green tick that means nothing.
#
# Split into jobs rather than one long script so a failure names itself in the
# checks list: "typecheck" and "browser" failing are different problems with
# different owners, and reading which one broke out of a 400-line log is work
# nobody should have to do twice.

name: verify

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suites are noisy about a TTY they do not have.
  CI: 'true'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # All three projects: `src`, the harness, and `server` + `mcp`. The last
      # of those was not checked by anything for most of this repo's life, which
      # is exactly why it is named here rather than left implicit.
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: npm ci
      # Pinned exactly. `flightsql-dbapi` pins `sqlalchemy<2` and installing it
      # once silently broke PyIceberg's catalogue here — a failure that
      # presented as an Iceberg conformance bug with nothing to do with Iceberg.
      - run: pip install -r requirements.txt
      # The conformance legs skip themselves when their interpreter is missing.
      # That is right locally and wrong here, so the install above is a hard
      # dependency of this job and a green run genuinely means they executed.
      - run: npm run test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's own browser, matching the pinned @playwright/test. The
      # `CHROMIUM_PATH` escape hatch in the config exists for images that ship a
      # different build; a hosted runner has no such constraint, so this uses
      # the ordinary path and keeps the escape hatch untested-by-default rather
      # than load-bearing.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # --- `verify:chartroom`, split the same way and for the same reason -------

  chartroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:chartroom
      - run: npm run test:chartroom

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      # The venv was a manual prerequisite, which is why this gate had never run
      # anywhere but on a machine somebody had set up by hand. `setup:agent` is
      # the same three commands the README asks for, in a form CI can call.
      - run: npm run setup:agent
      - run: npm run verify:agent

  chartroom-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The studio's own config starts a chartroom-server against a scratch
      # SQLite file and a blanked API key, so this exercises the degrade path.
      - run: npm run e2e:chartroom
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chartroom-playwright-report
          path: |
            chartroom/studio/playwright-report/
            chartroom/studio/test-results/
          retention-days: 7
