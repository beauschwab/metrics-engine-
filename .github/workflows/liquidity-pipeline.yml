# The liquidity pipeline's own gate: the end-to-end run, on every change to it.
#
# Two legs in one job, because they share a setup and an ordering:
#
#   pytest              lands the contracted extracts, builds the dbt models,
#                       applies the deployed rules, files the report, computes
#                       the LCR and reconciles — all on DuckDB. The registry is
#                       started first, so the live-registry tests run here too
#                       rather than skipping: CI proves both the HTTP path and
#                       that the committed snapshot serves the same bytes.
#   airflow dags test   the same runs, executed by Airflow itself — both DAGs,
#                       plus a check that the conformance run recorded an
#                       asset event for every conformed slice and table.
#
# What CI deliberately does not cover: partition keys are assigned by the
# *scheduler* when it creates a run from a partitioned timetable (AIP-76), and
# `dags test` builds a manual run. Standing a scheduler up here would trade a
# 90-second job for a flaky multi-minute one; the scheduler proof is run by
# hand and written up in the README's "What is proven".
name: liquidity-pipeline

on:
  push:
    branches: [main]
    paths: ['pipelines/liquidity/**', '.github/workflows/liquidity-pipeline.yml']
  pull_request:
    paths: ['pipelines/liquidity/**', '.github/workflows/liquidity-pipeline.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  UV_HTTP_TIMEOUT: '180'

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines/liquidity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen

      # The registry, live, seeded from the shipped workspace. The snapshot
      # refresh cuts and promotes release 1 if the channel is empty — the same
      # two acts a human performs — and then asserts the committed snapshot
      # still matches what the channel serves.
      #
      # KEEL_IDENTITY_HEADER names the header the registry reads an identity
      # from. The shipped workspace is tier-1, so without it both acts land as
      # `unknown` and ADR-57 refuses the promotion: one name cannot both cut
      # and deploy a tier-1 release. The script asserts two.
      - run: npm ci
        working-directory: .
      - run: |
          npx tsx packages/registry/index.ts &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/api/health && break; sleep 1
          done
        working-directory: .
        env:
          KEEL_SQLITE_FILE: /tmp/keel-ci.db
          KEEL_IDENTITY_HEADER: x-keel-identity
      - run: ./scripts/refresh_registry_snapshot.sh
        env:
          KEEL_SNAPSHOT_CUTTER: ci-release-manager
          KEEL_SNAPSHOT_PROMOTER: ci-deployer
      # Manifest and artifact responses carry promotion/save timestamps, so a
      # fresh registry can never reproduce them byte-for-byte; the rules and
      # compiled plans are pure functions of the released documents and must
      # not drift from what is committed.
      - run: git diff --exit-code registry_snapshot/rules registry_snapshot/plans

      - run: uv run pytest -q

      - name: airflow dags test
        run: |
          uv run airflow db migrate
          uv run airflow dags test daily_liquidity_conformance 2026-06-30
          uv run python scripts/check_asset_events.py
          uv run airflow dags test daily_liquidity_regulatory 2026-06-30
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/pipelines/liquidity/.local/airflow
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/pipelines/liquidity/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
